name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Checks to run
        type: choice
        default: all
        options: [all, android, desktop]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'android'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run test:tools
      - name: Check native smoke tool syntax
        run: node --check scripts/windows-native-smoke.mjs
      - name: Parse Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($scriptPath in @('scripts/windows-native-probe.ps1', 'scripts/measure-windows-resources.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - id: ui-tests
        run: npm run test:ui
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Ad-hoc sign and verify Mac internal app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - src-tauri/target/release/bundle/macos/SideTask.app
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/SideTask.app
      - name: Archive Mac app preserving bundle metadata
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/SideTask.app SideTask-macos.zip
      - name: Record package checksums
        run: node scripts/artifact-manifest.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SideTask-trial-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            apps/desktop/SideTask-macos.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.ui-tests.outcome == 'failure'
        with:
          name: ui-failure-${{ runner.os }}-${{ github.sha }}
          path: apps/desktop/tests/results/
          retention-days: 7

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Install Android SDK and NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/sidetask-android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$RUNNER_TEMP/android-tools.zip"
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build Android release APK (unsigned CI output)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          npm run tauri -- android build --ci --apk --target aarch64 x86_64
      - name: Verify APK 16 KB ZIP alignment
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SideTask-trial-Android-ARM64-X64-${{ github.sha }}
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sync-sql:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sidetask-ci-only
          POSTGRES_DB: sidetask_sync_test
        options: >-
          --health-cmd "pg_isready -U postgres -d sidetask_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify sync migration and account isolation on PostgreSQL 17
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for sql in \
            supabase/tests/bootstrap.sql \
            supabase/migrations/202610040001_desktop_sync.sql \
            supabase/migrations/202610040001_desktop_sync.sql \
            supabase/tests/sync.sql; do
            docker exec -i -e PGOPTIONS='-c sidetask.test_mode=on' "$POSTGRES_CONTAINER" \
              psql -X --set=ON_ERROR_STOP=1 --username=postgres --dbname=sidetask_sync_test < "$sql"
          done

  rust-advisories:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
